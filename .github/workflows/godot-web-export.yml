name: Godot Web Export

on:
  pull_request:
    paths:
      - "prototypes/godot-gate-configurator/**"
      - ".github/workflows/godot-web-export.yml"
  push:
    branches:
      - main
    paths:
      - "prototypes/godot-gate-configurator/**"
      - ".github/workflows/godot-web-export.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-web-export-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.3"
  PROJECT_PATH: prototypes/godot-gate-configurator

jobs:
  export-web:
    name: Export Godot Web
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install export templates
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ ! -d "$TEMPLATE_DIR" ]; then
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$TEMPLATE_DIR"
          fi
          test -d "$TEMPLATE_DIR"

      - name: Export Web build
        run: |
          rm -rf build/web
          mkdir -p build/web
          EXPORT_DIR="$(readlink -f build)"
          cd "$PROJECT_PATH"
          godot --headless --verbose --export-release "Web" "$EXPORT_DIR/web/index.html"
          test -s "$EXPORT_DIR/web/index.html"
          test -s "$EXPORT_DIR/web/index.wasm"
          test -s "$EXPORT_DIR/web/index.pck"

      - name: Verify export sizes
        run: |
          du -h build/web/*
          test "$(stat -c%s build/web/index.wasm)" -gt 25000000

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhp-godot-gate-web
          path: build/web
          if-no-files-found: error
          retention-days: 7

      # The export is deliberately not copied into public/ or committed to Git.
      # Cloudflare Workers Assets has a per-file limit; the large WASM is served
      # from the DHP_GODOT_R2 binding instead.
