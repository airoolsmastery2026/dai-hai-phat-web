name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Sentrux v0.5.7
        run: |
          curl -fsSL -o /usr/local/bin/sentrux \
            https://github.com/sentrux/sentrux/releases/download/v0.5.7/sentrux-linux-x86_64
          sudo chmod +x /usr/local/bin/sentrux
          sentrux --version

      - name: Architecture governance
        shell: bash
        run: |
          set +e
          output="$(npm run architecture:check 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            message="$(printf '%s' "$output" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g' | cut -c1-4000)"
            echo "::error title=Sentrux architecture governance::$message"
            exit "$status"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        shell: bash
        run: |
          set +e
          output="$(npm run test 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            message="$(printf '%s' "$output" | tail -c 12000 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g' | cut -c1-4000)"
            echo "::error title=Unit test failure::$message"
            exit "$status"
          fi

      - name: Production build
        run: npm run build
