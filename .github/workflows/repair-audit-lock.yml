name: Repair Audit Lock

on:
  push:
    branches:
      - fix/restore-public-ai-chatbot

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch nanoid override and lock entry
        shell: bash
        run: |
          set -euo pipefail
          VERSION="3.3.18"
          TARBALL="$(npm view nanoid@${VERSION} dist.tarball)"
          INTEGRITY="$(npm view nanoid@${VERSION} dist.integrity)"
          VERSION="$VERSION" TARBALL="$TARBALL" INTEGRITY="$INTEGRITY" node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.VERSION;
          const tarball = process.env.TARBALL;
          const integrity = process.env.INTEGRITY;

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = pkg.overrides || {};
          pkg.overrides.nanoid = version;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const entry = lock.packages?.['node_modules/nanoid'];
          if (!entry) throw new Error('package-lock nanoid entry not found');
          entry.version = version;
          entry.resolved = tarball;
          entry.integrity = integrity;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE

      - name: Verify deterministic install
        run: npm ci

      - name: Verify dependency security audit
        run: npm audit --audit-level=high

      - name: Verify application quality
        run: npm run quality

      - name: Commit audited lock repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "No lock repair required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: patch nanoid override and lock [skip ci]"
          git push origin HEAD:fix/restore-public-ai-chatbot
