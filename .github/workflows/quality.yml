name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - fix/restore-public-ai-chatbot

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Audit, lint, typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair audited transitive dependencies
        run: npm audit fix

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Build
        run: npm run build

      - name: Enforce unit test result
        if: always()
        run: test "${{ steps.tests.outcome }}" = "success"
