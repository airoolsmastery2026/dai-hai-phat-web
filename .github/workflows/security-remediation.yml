name: Security Remediation

on:
  push:
    branches:
      - fix/npm-audit-high

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/npm-audit-high

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile with compatible security fixes
        run: npm audit fix --package-lock-only

      - name: Install exact dependencies
        run: npm ci

      - name: Verify no high or critical audit findings
        run: npm audit --audit-level=high

      - name: Run repository quality gate
        run: npm run quality

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: refresh dependency lockfile for security advisories [skip ci]"
          git push origin HEAD:fix/npm-audit-high
