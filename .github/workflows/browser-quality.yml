name: DHP Full Quality + Chromium Smoke

on:
  push:
    branches:
      - chore/dhp-browser-ci-bootstrap
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhp-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-and-browser:
    name: Install, full quality gate, and real Chromium smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run canonical DHP quality gate
        run: npm run quality
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start production server
        env:
          PORT: 3000
          HOSTNAME: 127.0.0.1
        run: |
          npm run start > /tmp/dhp-next.log 2>&1 &
          echo $! > /tmp/dhp-next.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo 'DHP production server is ready'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/dhp-next.log
          exit 1
      - name: Verify desktop and mobile in real Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const failures = [];
            for (const viewport of [
              { name: 'mobile-390', width: 390, height: 844 },
              { name: 'desktop-1440', width: 1440, height: 900 }
            ]) {
              const page = await browser.newPage({ viewport });
              page.on('pageerror', error => failures.push(viewport.name + ': ' + error.message));
              const response = await page.goto('http://127.0.0.1:3000/', { waitUntil: 'networkidle', timeout: 60000 });
              if (!response || response.status() !== 200) failures.push(viewport.name + ': HTTP ' + (response && response.status()));
              const result = await page.evaluate(() => ({ title: document.title, width: document.documentElement.scrollWidth, viewport: window.innerWidth }));
              if (!result.title) failures.push(viewport.name + ': missing document title');
              if (result.width > result.viewport) failures.push(viewport.name + ': horizontal overflow ' + result.width + ' > ' + result.viewport);
              await page.screenshot({ path: '/tmp/dhp-' + viewport.name + '.png', fullPage: true });
              console.log(JSON.stringify({ viewport: viewport.name, ...result }));
              await page.close();
            }
            await browser.close();
            if (failures.length) { console.error(failures.join('\n')); process.exit(1); }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload browser screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhp-chromium-smoke-${{ github.run_number }}
          path: |
            /tmp/dhp-mobile-390.png
            /tmp/dhp-desktop-1440.png
            /tmp/dhp-next.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/dhp-next.pid ]; then kill "$(cat /tmp/dhp-next.pid)" || true; fi
