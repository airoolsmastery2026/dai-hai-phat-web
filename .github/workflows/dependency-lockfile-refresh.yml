name: Dependency Lockfile Refresh (temporary)

on:
  push:
    branches:
      - security/next-dependency-remediation

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from pinned manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Apply compatible security fixes
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Verify high and critical dependency audit
        run: npm audit --audit-level=high
      - name: Commit regenerated lockfile
        if: success()
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): refresh audited dependency lockfile"
            git push
          fi
      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile-refresh
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
