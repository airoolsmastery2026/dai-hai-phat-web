name: Dependency Lockfile Refresh (temporary)

on:
  push:
    branches:
      - security/next-dependency-remediation

permissions:
  contents: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from pinned manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Apply compatible security fixes
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Verify dependency audit
        run: npm audit --audit-level=high
      - name: Upload generated lockfile and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile-refresh
          path: |
            package-lock.json
          if-no-files-found: error
          retention-days: 3
