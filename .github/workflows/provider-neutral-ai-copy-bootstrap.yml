name: Provider-neutral AI copy bootstrap

on:
  push:
    branches:
      - "fix/provider-neutral-ai-copy-20260821"

permissions:
  contents: write

jobs:
  patch-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: "fix/provider-neutral-ai-copy-20260821"

      - name: Apply bounded copy patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/components/sections/AIOfficeSection.tsx"): [
                  ("Gợi ý từ Gemini", "Gợi ý từ trợ lý AI"),
                  ("Gemini đang phân tích dữ liệu hồ sơ đã xác nhận…", "Đang phân tích dữ liệu hồ sơ đã xác nhận…"),
                  ("Gemini phân tích hồ sơ", "Phân tích hồ sơ bằng AI"),
                  (
                      "Phân tích do Gemini tạo từ dữ liệu phi nhạy cảm, không phải kết luận kỹ\n        thuật hoặc báo giá.",
                      "Phân tích sơ bộ được tạo từ dữ liệu phi nhạy cảm, không phải kết luận kỹ\n        thuật hoặc báo giá.",
                  ),
              ],
              Path("src/hooks/useAI.ts"): [
                  ("Không thể phân tích hồ sơ bằng Gemini.", "Không thể phân tích hồ sơ lúc này."),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count < 1:
                      raise SystemExit(f"Expected copy not found in {path}: {old!r}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          test_path = Path("tests/public-image-intake-truthfulness.test.mjs")
          test_text = test_path.read_text(encoding="utf-8")
          hook_decl = 'const hookUrl = new URL("../src/hooks/useAI.ts", import.meta.url);\n'
          office_decl = 'const officeUrl = new URL("../src/components/sections/AIOfficeSection.tsx", import.meta.url);\n'
          if office_decl not in test_text:
              if hook_decl not in test_text:
                  raise SystemExit("Could not locate hookUrl declaration in truthfulness test")
              test_text = test_text.replace(hook_decl, hook_decl + office_decl, 1)

          provider_test = '''\n\ntest("public project analysis copy stays provider-neutral across gateway fallback", async () => {\n  const [office, hook] = await Promise.all([read(officeUrl), read(hookUrl)]);\n\n  assert.match(office, /Gợi ý từ trợ lý AI/);\n  assert.match(office, /Đang phân tích dữ liệu hồ sơ đã xác nhận/);\n  assert.match(office, /Phân tích hồ sơ bằng AI/);\n  assert.match(hook, /Không thể phân tích hồ sơ lúc này/);\n  assert.doesNotMatch(office, /Gemini/);\n  assert.doesNotMatch(hook, /phân tích hồ sơ bằng Gemini/i);\n});\n'''
          if 'public project analysis copy stays provider-neutral across gateway fallback' not in test_text:
              test_text = test_text.rstrip() + provider_test
          test_path.write_text(test_text, encoding="utf-8")
          PY

      - name: Run focused regression test
        run: node --test tests/public-image-intake-truthfulness.test.mjs

      - name: Remove bootstrap workflow from branch
        run: rm .github/workflows/provider-neutral-ai-copy-bootstrap.yml

      - name: Commit bounded fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/sections/AIOfficeSection.tsx src/hooks/useAI.ts tests/public-image-intake-truthfulness.test.mjs .github/workflows/provider-neutral-ai-copy-bootstrap.yml
          git commit -m "fix: make project analysis copy provider neutral"
          git push origin HEAD:"fix/provider-neutral-ai-copy-20260821"
